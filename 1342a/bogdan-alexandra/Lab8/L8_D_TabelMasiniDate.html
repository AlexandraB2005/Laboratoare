<!DOCTYPE html>
<html>
<head>
<title>Tabel masini</title>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}
</style>
</head>
<body>
<h1> Masinile dorite </h1>

<form onsubmit="return adaugaMasina()">
  <input id="marca" placeholder="Marca" required>
  <input id="model" placeholder="Model" required>
  <input id="culoare" placeholder="Culoare" required>
  <input id="anFab" type="number" placeholder="An fabricatie" required>
  <button type="submit">Adauga masina</button>
  <button type="button" onclick="stergeToate()">Sterge toate</button>
</form>
<p id="mesaj"></p>
<table id="tm">
<tr>
    <th>Marca</th>
    <th>Model</th>
    <th>Culoare</th>
    <th>An fabricatie</th>
  </tr>
</table>

<script>
var m1 = new masina("Opel", "Zafira", "gri", 2015);
var m2 = new masina("Seat", "Ibiza", "roz", 2018);

document.getElementById("tm").innerHTML += m1.randNou();
document.getElementById("tm").innerHTML += m2.randNou();

// array cu DOAR datele masinilor (fara textul randului de tabel)
var masiniDate = [];
if (localStorage.masiniDate) {
  var dateCitite = JSON.parse(localStorage.masiniDate);
  for (var i = 0; i < dateCitite.length; i++) {
    var d = dateCitite[i];
    // din obiect simplu -> obiect masina, ca sa aiba din nou metoda randNou()
    var m = new masina(d.marca, d.model, d.culoare, d.anFab);
    document.getElementById("tm").innerHTML += m.randNou();
    masiniDate.push(d);
  }
}

function masina(mk, md, cl, an){
this.marca = mk;
this.model = md;
this.culoare = cl;
this.anFab = an;
this.randNou = function() {return "<tr><td>" + this.marca +"</td><td>" + this.model + "</td><td>" + this.culoare + "</td><td>" + this.anFab + "</td></tr>"}
}

function valideaza(marca, model, culoare, an) {
if (marca.trim() === "" || model.trim() === "" || culoare.trim() === "") {
return "Marca, modelul si culoarea nu pot fi goale!";
}
var anNum = Number(an);
var anCurent = new Date().getFullYear();
if (an.trim() === "" || !Number.isInteger(anNum) || anNum < 1900 || anNum > anCurent) {
return "Anul trebuie sa fie un numar intreg intre 1900 si " + anCurent + "!";
}
return "";
}

function adaugaMasina() {
var marca = document.getElementById("marca").value;
var model = document.getElementById("model").value;
var culoare = document.getElementById("culoare").value;
var an = document.getElementById("anFab").value;

var eroare = valideaza(marca, model, culoare, an);
if (eroare !== "") {
document.getElementById("mesaj").innerHTML = eroare;
return false;
}
document.getElementById("mesaj").innerHTML = "";

var mNoua = new masina(marca.trim(), model.trim(), culoare.trim(), Number(an));
document.getElementById("tm").innerHTML += mNoua.randNou();

// se salveaza doar datele, nu si randNou
masiniDate.push({
  marca: mNoua.marca,
  model: mNoua.model,
  culoare: mNoua.culoare,
  anFab: mNoua.anFab
});
localStorage.setItem("masiniDate", JSON.stringify(masiniDate));

return false;
}

function stergeToate() {
var tabel = document.getElementById("tm");
// se pastreaza doar randul de antet
while (tabel.rows.length > 1) {
  tabel.deleteRow(1);
}
masiniDate = [];
localStorage.removeItem("masiniDate");
document.getElementById("mesaj").innerHTML = "";
}
</script>
</body>
</html>

<!-- In Local Storage (cheia masiniDate) se pastreaza doar datele, de ex.
  [{"marca":"Dacia","model":"Logan","culoare":"alb","anFab":2020}]
  La incarcare fiecare element e transformat cu new masina(...) ca sa aiba din nou metoda randNou(). -->
