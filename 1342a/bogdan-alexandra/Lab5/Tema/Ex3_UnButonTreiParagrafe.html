<!DOCTYPE html>
<html>
<head>
    <title>Modificari paragrafe</title>

    <script>
        let current = 1;

        function myFunction() {
            if (current == 1) {
                document.getElementById("p1").style.display = "none";

                let x = document.getElementById("p2");
                x.style.display = "block";
                x.style.backgroundColor = "yellow";
                x.style.color = "pink";

                current = 2;
            }
            else if (current == 2) {
                document.getElementById("p2").style.display = "none";

                let x = document.getElementById("p3");
                x.style.display = "block";
                x.style.backgroundColor = "pink";
                x.style.color = "white";

                current = 3;
            }
            else if (current == 3) {
                document.getElementById("p3").style.display = "none";

                let x = document.getElementById("p1");
                x.style.display = "block";
                x.style.backgroundColor = "purple";
                x.style.color = "black";

                current = 1;
            }
        }
    </script>
</head>

<body>
    <h1>Modificari paragrafe la click pe buton</h1>

    <p id="p1" style="display: block;">Acesta este un paragraf</p>
    <p id="p2" style="display: none;">Si acesta este un paragraf</p>
    <p id="p3" style="display: none;">Acesta este inca un paragraf</p>

    <button type="button" onclick="myFunction()">Apasa-ma!</button>
</body>
</html>
