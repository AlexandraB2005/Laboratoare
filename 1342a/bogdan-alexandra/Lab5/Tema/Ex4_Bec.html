<!doctype html>
<html>
  <head>
    <title>Bec</title>
    <script>
      function on() {
        document.getElementById("bec").innerHTML = "Bec aprins";
        document.getElementById("img").src = "Bec_aprins.gif";
      }
      function off() {
        document.getElementById("bec").innerHTML = "Bec stins";
        document.getElementById("img").src = "Bec_stins.gif";
      }
    </script>
  </head>
  <body>
    <h1 id="bec">Bec stins</h1>

    <p>
      <img
        id="img"
        onmouseover="on()"
        onmouseout="off()"
        src="Bec_stins.gif"
        width="100"
        height="180"
      />
    </p>
  </body>
</html>
