<!DOCTYPE html>
<html>
<head>
<title>
Modificare folosind clase si evenimente
</title>
</head>
<body>
<h3> Utilizati Javascript si HTML DOM pentru a inlocui imaginile de mai jos asa cum este indicat in textele de deasupra lor</h3>
La click vor aparea Pisici
<hr />
<img class="animal" src="pesti.jpg" alt="Niste pesti" width="160" height="120">
<br /> <br />
La mouseover vor aparea Munti
<hr />
<img class="peisaj" src="desert.jpg" alt="O jungla" width="160" height="120">
<br /> <br />
La click vor aparea Caini
<hr />
<img class="animal" src="egrete.jpg" alt="Niste egrete" width="160" height="120">
<br /> <br />
la mouseout va aparea o Mare
<hr />
<img class="peisaj" src="jungla.jpg" alt="Un desert" width="160" height="120">

<script>
// Utilizati getElementsByClassName() pentru a modifica imaginile pentru a se potrivi cu textele de deasupra lor la aparitia evenimentelor indicate!
var animals = document.getElementsByClassName("animal");
var landscapes = document.getElementsByClassName("peisaj");

var firstAnimal = animals[0];
var secondAnimal = animals[1];
var firstLandscape = landscapes[0];
var secondLandscape = landscapes[1];

function showCats() {
    firstAnimal.src = "Img/pisici.jpg";
}

function showMountains() {
    firstLandscape.src = "Img/munti.jpg";
}

function showDogs() {
    secondAnimal.src = "Img/caini.jpg";
}

function showSea() {
    secondLandscape.src = "Img/mare.jpg";
}
firstAnimal.addEventListener("click", showCats);
firstLandscape.addEventListener("mouseover", showMountains);
secondAnimal.addEventListener("click", showDogs);
secondLandscape.addEventListener("mouseout", showSea);
</script>

</body>
</html>
