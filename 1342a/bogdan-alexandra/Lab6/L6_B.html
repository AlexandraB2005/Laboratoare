<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
</head>
<body>
   <button onclick="interchangeText()">Click me</button>
   <p id="par" onclick="changeText1()">Text initial</p>
   <p id="par2" onclick="changeText2()">Text initial 2</p>
<script>
function changeText1() {
    var text = prompt("Introduceti noul text al paragrafului:", "Text initial");
    if (text !== null && text !== "") {
        document.getElementById("par").innerHTML = text;
    }}
    function changeText2() {
    var text2 = prompt("Introduceti noul text al paragrafului 2:", "Text initial 2");
    if (text2 !== null && text2 !== "") {
        document.getElementById("par2").innerHTML = text2;
    }
}
function interchangeText() {
    var temp = document.getElementById("par").innerHTML;
    document.getElementById("par").innerHTML = document.getElementById("par2").innerHTML;
    document.getElementById("par2").innerHTML = temp;
}
</script>
</body>
</html>
