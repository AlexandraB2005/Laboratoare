<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CSS_C1</title>
    <style>
      #hd {
        font-variant: small-caps;
        color: magenta;
      }
      h1,
      caption {
        color: blue;
        background-color: #cccc00;
      }
      body {
        background-color: #ffffcc;
      }
      .center,

        text-align: center;
        color: red;
      }
      table {
        border-collapse: collapse;
        /* border: 1px solid green; */

      }
      td {

      }

      }

  </head>

</html>
